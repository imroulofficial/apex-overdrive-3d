name: Build Android App Bundle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-aab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build signed release AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Pushes to main must produce a signed, Play-uploadable bundle. Pull requests
      # (which cannot read secrets from forks) build an unsigned bundle to validate.
      REQUIRE_SIGNING: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        # Test ad units and the sandbox store stay on until the repository variable
        # VITE_RELEASE is set to 1 together with the production AdMob unit ids.
        env:
          VITE_RELEASE: ${{ vars.VITE_RELEASE }}
          VITE_ADMOB_BANNER: ${{ vars.VITE_ADMOB_BANNER }}
          VITE_ADMOB_INTERSTITIAL: ${{ vars.VITE_ADMOB_INTERSTITIAL }}
          VITE_ADMOB_REWARDED: ${{ vars.VITE_ADMOB_REWARDED }}
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Decode release keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            if [ "$REQUIRE_SIGNING" = "true" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; cannot sign the release bundle."
              exit 1
            fi
            echo "No keystore available; building an unsigned bundle for validation."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace -PversionCode=${{ github.run_number }} ${ADMOB_APP_ID:+-PadmobAppId=$ADMOB_APP_ID}

      - name: Verify bundle signature
        if: steps.keystore.outputs.signed == 'true'
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | tee verify.log
          grep -q "jar verified" verify.log

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: apex-overdrive-${{ steps.keystore.outputs.signed == 'true' && 'signed' || 'unsigned' }}-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
